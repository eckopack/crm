{% extends "vertrieb/base.html" %}
{% block title %}Löschen bestätigen{% endblock %}
{% block content %}
<div class="card" style="max-width: 500px;">
    <div class="card-body">
        <h5 class="card-title">Wirklich löschen?</h5>
        <p class="card-text">„{{ object }}" wird unwiderruflich gelöscht.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Ja, löschen</button>
            <a href="{{ request.META.HTTP_REFERER }}" class="btn btn-outline-secondary">Abbrechen</a>
        </form>
    </div>
</div>
{% endblock %}
