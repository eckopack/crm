{% extends "vertrieb/base.html" %}
{% block title %}Firma {% if object %}bearbeiten{% else %}anlegen{% endif %}{% endblock %}
{% block content %}
<h2 class="mb-3">Firma {% if object %}bearbeiten{% else %}anlegen{% endif %}</h2>
<div class="card" style="max-width: 700px;">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {% include "vertrieb/_form_fields.html" %}
            <button type="submit" class="btn btn-primary">Speichern</button>
            <a href="{% url 'vertrieb:firma_list' %}" class="btn btn-outline-secondary">Abbrechen</a>
        </form>
    </div>
</div>
{% endblock %}
