{% extends "vertrieb/base.html" %}
{% block title %}Deal {% if object %}bearbeiten{% else %}anlegen{% endif %}{% endblock %}
{% block content %}
<h2 class="mb-3">Deal {% if object %}bearbeiten{% else %}anlegen{% endif %}</h2>
<div class="card" style="max-width: 700px;">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {% include "vertrieb/_form_fields.html" %}
            <button type="submit" class="btn btn-primary">Speichern</button>
            <a href="{% url 'vertrieb:deal_list' %}" class="btn btn-outline-secondary">Abbrechen</a>
        </form>
    </div>
</div>
<script>
// Schlägt beim Wechsel der Phase die Standard-Wahrscheinlichkeit vor (bleibt editierbar).
document.addEventListener("DOMContentLoaded", function () {
    var standard = {"lead": 10, "qualifiziert": 30, "angebot": 50, "verhandlung": 70, "gewonnen": 100, "verloren": 0};
    var phaseSelect = document.getElementById("id_phase");
    var whkInput = document.getElementById("id_wahrscheinlichkeit");
    if (phaseSelect && whkInput) {
        phaseSelect.addEventListener("change", function () {
            if (standard.hasOwnProperty(this.value)) {
                whkInput.value = standard[this.value];
            }
        });
    }
    // 24.10.2026, auf Wunsch von Björn: zeigt beim Eintippen der Tonnen direkt eine grobe
    // Stückzahl-Schätzung an (Gramm/Stück siehe Deal.GRAMM_JE_STUECK_TRINKHALM/_BESTECK in
    // models.py - Besteck ist ein gemittelter Wert aus Klein-/Großbesteck, siehe dort).
    var GRAMM_JE_STUECK = {"trinkhalm": 1.0, "besteck": 4.25};
    ["trinkhalm", "besteck"].forEach(function (kategorie) {
        var input = document.getElementById("id_potenzial_tonnen_" + kategorie);
        if (!input) return;
        var hinweis = document.createElement("div");
        hinweis.className = "form-text";
        input.insertAdjacentElement("afterend", hinweis);
        var aktualisieren = function () {
            var tonnen = parseFloat(input.value.replace(",", "."));
            if (!isNaN(tonnen) && tonnen >= 0) {
                var stueck = Math.round((tonnen * 1000000) / GRAMM_JE_STUECK[kategorie]);
                hinweis.textContent = "≈ " + stueck.toLocaleString("de-DE") + " Stück (grobe Schätzung)";
            } else {
                hinweis.textContent = "";
            }
        };
        input.addEventListener("input", aktualisieren);
        aktualisieren();
    });
});
</script>
{% endblock %}
