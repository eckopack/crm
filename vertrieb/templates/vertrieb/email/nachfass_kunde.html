<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurze Rückfrage von ECKO-PACK</title>
</head>
<body style="margin:0; padding:0; background-color:#f5f6f8; font-family:Arial, Helvetica, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f6f8; padding:24px 0;">
  <tr>
    <td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background-color:#ffffff; border-radius:8px; overflow:hidden;">

        <tr>
          <td style="background-color:#ffffff; padding:24px 32px; border-bottom:1px solid #e5e5e5;">
            <img src="{{ logo_url }}" alt="ECKO-PACK" height="32" style="display:block; height:32px; width:auto;">
          </td>
        </tr>

        <tr>
          <td style="padding:32px;">
            <p style="margin:0 0 16px 0; font-size:16px; color:#3c3c3b;">
              Guten Tag{% if ansprechpartner %} {{ ansprechpartner.vorname }} {{ ansprechpartner.nachname }}{% endif %},
            </p>
            <div style="margin:0 0 24px 0; font-size:16px; color:#3c3c3b; line-height:1.5;">
              {{ nachricht_text|linebreaks }}
            </div>
            <p style="margin:24px 0 0 0; font-size:14px; color:#3c3c3b;">
              Mit freundlichen Grüßen<br>
              Ihr ECKO-PACK Team
            </p>
          </td>
        </tr>

        <tr>
          <td style="background-color:#f5f6f8; padding:16px 32px; font-size:12px; color:#888;">
            ECKO-PACK GmbH · Wasbeker Straße 324 · D-24537 Neumünster
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
