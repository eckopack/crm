<script>
// Füllt bei Auswahl eines Artikels (oder Änderung der Menge) automatisch Bezeichnung/
// Einheit/Einzelpreis/USt-Satz der jeweiligen Positionszeile - rein als Vorschlag, alle
// Felder bleiben danach frei überschreibbar. Fehlt ein Feld in der Zeile (z. B. kein
// Einzelpreis bei Packschein/Lieferschein), wird es einfach übersprungen.
//
// Zusätzlich: hat der gewählte Artikel Preisstaffeln (Mengenrabatt-Stufen), wird ein
// Auswahlfeld mit allen Stufen ("ab X Stk – Y €") eingeblendet, damit man die gesamte
// Staffel auf einen Blick sieht statt sie durch Ausprobieren verschiedener Mengen zu
// erraten. Eine gewählte Stufe setzt Menge und Einzelpreis auf diese Stufe; die Menge
// bleibt danach frei nach oben (oder unten, in eine andere Stufe) anpassbar - ändert man
// sie manuell, greift wie gehabt die normale Mengen→Preis-Zuordnung oben.
document.addEventListener('DOMContentLoaded', function () {
    function feldFuerZeile(select, feld) {
        var match = select.id.match(/^id_(.+)-artikel$/);
        if (!match) return null;
        return document.getElementById('id_' + match[1] + '-' + feld);
    }

    function aktualisiereStaffelAuswahl(select, daten) {
        var staffelFeld = document.getElementById(select.id + '-staffeln');
        if (!staffelFeld) return;
        staffelFeld.innerHTML = '';
        var staffeln = (daten && daten.preisstaffeln) ? daten.preisstaffeln : [];
        if (!staffeln.length) {
            staffelFeld.style.display = 'none';
            return;
        }
        var platzhalter = document.createElement('option');
        platzhalter.value = '';
        platzhalter.textContent = 'Preisstaffel wählen …';
        staffelFeld.appendChild(platzhalter);
        staffeln.forEach(function (s) {
            var opt = document.createElement('option');
            opt.value = s.ab_menge + '|' + s.preis_netto;
            opt.textContent = 'ab ' + s.ab_menge + ' Stk – ' + s.preis_netto + ' €/Stk';
            staffelFeld.appendChild(opt);
        });
        if (daten.verkaufspreis_flatrate !== null) {
            var flat = document.createElement('option');
            flat.value = '0|' + daten.verkaufspreis_flatrate;
            flat.textContent = 'Flatrate (unter kleinster Staffel) – ' + daten.verkaufspreis_flatrate + ' €/Stk';
            staffelFeld.appendChild(flat);
        }
        staffelFeld.style.display = '';
    }

    function aktualisiereZeile(select) {
        var artikelId = select.value;
        var hinweisFeld = document.getElementById(select.id + '-hinweis');
        var staffelFeld = document.getElementById(select.id + '-staffeln');
        if (!artikelId) {
            if (hinweisFeld) hinweisFeld.textContent = '';
            if (staffelFeld) { staffelFeld.style.display = 'none'; staffelFeld.innerHTML = ''; }
            return;
        }
        var mengeFeld = feldFuerZeile(select, 'menge');
        var menge = mengeFeld ? mengeFeld.value : '';
        var url = '/artikel/' + encodeURIComponent(artikelId) + '/daten.json'
            + (menge ? ('?menge=' + encodeURIComponent(menge)) : '');
        fetch(url).then(function (r) { return r.ok ? r.json() : null; }).then(function (daten) {
            if (!daten) return;
            var bezeichnungFeld = feldFuerZeile(select, 'bezeichnung');
            if (bezeichnungFeld) bezeichnungFeld.value = daten.bezeichnung;
            var einheitFeld = feldFuerZeile(select, 'einheit');
            if (einheitFeld) einheitFeld.value = daten.einheit;
            var preisFeld = feldFuerZeile(select, 'einzelpreis');
            if (preisFeld && daten.einzelpreis !== null) preisFeld.value = daten.einzelpreis;
            var steuerFeld = feldFuerZeile(select, 'steuersatz');
            if (steuerFeld && daten.steuersatz !== null) steuerFeld.value = daten.steuersatz;
            if (hinweisFeld) {
                var teile = [];
                if (daten.status) teile.push(daten.status);
                if (daten.lagerbestand_aktuell !== null) {
                    teile.push('Lager: ' + daten.lagerbestand_aktuell + (daten.unter_mindestbestand ? ' ⚠ unter Meldebestand' : ''));
                }
                hinweisFeld.textContent = teile.join(' · ');
            }
            aktualisiereStaffelAuswahl(select, daten);
        });
    }

    document.querySelectorAll('select.artikel-auswahl').forEach(function (select) {
        select.addEventListener('change', function () { aktualisiereZeile(select); });
        var mengeFeld = feldFuerZeile(select, 'menge');
        if (mengeFeld) mengeFeld.addEventListener('change', function () { aktualisiereZeile(select); });

        var staffelFeld = document.getElementById(select.id + '-staffeln');
        if (staffelFeld) {
            staffelFeld.addEventListener('change', function () {
                if (!staffelFeld.value) return;
                var teile = staffelFeld.value.split('|');
                var abMenge = teile[0], preis = teile[1];
                var mFeld = feldFuerZeile(select, 'menge');
                if (mFeld && abMenge !== '0') mFeld.value = abMenge;
                var pFeld = feldFuerZeile(select, 'einzelpreis');
                if (pFeld) pFeld.value = preis;
            });
        }
    });
});
</script>
