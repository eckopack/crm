<!DOCTYPE html>
{% load static %}
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anmelden – ECKO-PACK CRM</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/eckopack-icon-32.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/eckopack-icon-180.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --ecko-dark: #3c3c3b;
            --ecko-mint: #00ffaa;
            --ecko-mint-dark: #05db8e;
        }
        body {
            min-height: 100vh;
            background: var(--ecko-dark);
        }
        .login-logo { max-width: 220px; margin: 0 auto 1.5rem; display: block; }
        .btn-primary {
            background: linear-gradient(135deg, var(--ecko-mint) 0%, var(--ecko-mint-dark) 100%);
            border-color: var(--ecko-mint-dark);
            color: var(--ecko-dark);
            font-weight: 600;
        }
        .btn-primary:hover, .btn-primary:focus, .btn-primary:active {
            background: var(--ecko-mint-dark);
            border-color: var(--ecko-mint-dark);
            color: #fff;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
<div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="card shadow" style="max-width: 400px; width:100%;">
        <div class="card-body p-4">
            <img src="{% static 'img/eckopack-logo.png' %}" alt="ECKO-PACK" class="login-logo">
            <h4 class="card-title mb-3 text-center">CRM Login</h4>
            {% if form.errors %}
                <div class="alert alert-danger">Benutzername oder Passwort falsch.</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Benutzername</label>
                    <input type="text" name="username" class="form-control" autofocus required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Passwort</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit" class="btn btn-primary w-100">Anmelden</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
