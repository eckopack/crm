# Render.com Blueprint.
# Läuft auf dem Starter-Plan (kostenpflichtig, aktuell 7 $/Monat) MIT persistenter
# Disk (1 GB, ca. 0,25 $/Monat zusätzlich) – die SQLite-Datenbank liegt auf dieser
# Disk unter /var/data und übersteht damit Neustarts und Inaktivitäts-Spin-downs
# (anders als beim kostenlosen Plan, der keine persistente Disk unterstützt und bei
# jeder Inaktivität >15 Min das Dateisystem zurücksetzt). Für echten Dauerbetrieb mit
# mehreren Nutzern und Backups später trotzdem auf einen VPS mit PostgreSQL umziehen
# (siehe README.md, Abschnitt Deployment) – diese Lösung ist die kostengünstige
# Zwischenstufe für die interne Testphase.
#
# WICHTIG (Fix 11.10.2026): Persistente Disks sind laut Render-Doku während des
# Build Command NICHT verfügbar, erst zur Laufzeit (Start Command). migrate/
# beispieldaten dürfen deshalb NICHT im Build Command laufen (sonst schreiben sie
# auf einen Pfad, der beim eigentlichen Start durch die echte, leere/alte Disk
# überlagert wird - genau das hat zuvor das Admin-Passwort nach jedem Deploy auf
# admin123 zurückgesetzt). Beide Befehle laufen jetzt im Start Command, direkt vor
# gunicorn. collectstatic bleibt im Build Command, da es nicht auf die Disk
# angewiesen ist.
#
# DIAGNOSE (11.10.2026, 2. Fix-Versuch): Trotz obigem Fix wird bei jedem Redeploy
# (auch ohne Code-Änderung, reiner "Manual Deploy") wieder ein neuer Admin mit
# admin123 angelegt und "Beispieldaten erfolgreich angelegt" ausgegeben - die
# Datenbank ist also bei jedem Start wieder leer. Die "ls -la /var/data" Zeilen
# haben das bestätigt: /var/data ist VOR UND NACH migrate komplett leer, obwohl
# migrate erfolgreich durchläuft. Django schreibt die DB also offenbar gar nicht
# auf die Disk.
#
# DIAGNOSE (11.10.2026, 3. Runde): Zusätzliche Zeilen geben aus, ob die Variable
# DJANGO_SQLITE_PATH im laufenden Prozess tatsächlich ankommt und welchen
# Datenbankpfad Django wirklich verwendet (settings.DATABASES). Reine Diagnose,
# keine Datenänderung. Nach Klärung der Ursache alle DEBUG-Zeilen wieder
# entfernen.

services:
  - type: web
    name: eckopack-crm
    runtime: python
    plan: starter
    disk:
      name: eckopack-data
      mountPath: /var/data
      sizeGB: 1
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput
    startCommand: >
      echo "=== DEBUG: DJANGO_SQLITE_PATH=$DJANGO_SQLITE_PATH ===" &&
      python manage.py shell -c "from django.conf import settings; print('=== DEBUG: DATABASES =', settings.DATABASES)" &&
      echo "=== DEBUG: /var/data VOR migrate ===" &&
      ls -la /var/data &&
      python manage.py migrate &&
      python manage.py beispieldaten &&
      echo "=== DEBUG: /var/data NACH beispieldaten ===" &&
      ls -la /var/data &&
      gunicorn eckopack_crm.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SQLITE_PATH
        value: /var/data/db.sqlite3
