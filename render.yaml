# Render.com Blueprint.
# Läuft auf dem Starter-Plan (kostenpflichtig, aktuell 7 $/Monat) MIT persistenter
# Disk (1 GB, ca. 0,25 $/Monat zusätzlich) – die SQLite-Datenbank liegt auf dieser
# Disk unter /var/data und übersteht damit Neustarts und Inaktivitäts-Spin-downs
# (anders als beim kostenlosen Plan, der keine persistente Disk unterstützt und bei
# jeder Inaktivität >15 Min das Dateisystem zurücksetzt). Für echten Dauerbetrieb mit
# mehreren Nutzern und Backups später trotzdem auf einen VPS mit PostgreSQL umziehen
# (siehe README.md, Abschnitt Deployment) – diese Lösung ist die kostengünstige
# Zwischenstufe für die interne Testphase.
#
# WICHTIG (Fix 11.10.2026): Persistente Disks sind laut Render-Doku während des
# Build Command NICHT verfügbar, erst zur Laufzeit (Start Command). migrate/
# beispieldaten dürfen deshalb NICHT im Build Command laufen. Beide Befehle laufen
# im Start Command, direkt vor gunicorn. collectstatic bleibt im Build Command, da
# es nicht auf die Disk angewiesen ist.
#
# ECHTE URSACHE GEFUNDEN (11.10.2026): Die Datenbank wurde bei jedem Deploy neu
# angelegt, weil eckopack_crm/settings.py die Variable DJANGO_SQLITE_PATH gar
# nicht ausgewertet hat (ein Tippfehler bei einem früheren Datei-Update - eine
# Kopie der korrigierten settings.py landete versehentlich im falschen Ordner).
# Jetzt in eckopack_crm/settings.py korrigiert: Die SQLite-Datei liegt damit
# tatsächlich unter /var/data/db.sqlite3 auf der persistenten Disk.
#
# EINMALIGER IMPORT (11.10.2026, erledigt): import_leadliste lief einmalig im Start
# Command und hat die echte Lead-Recherche-Liste erfolgreich übernommen (35 Firmen,
# 51 Kontakte, 36 Deals, 1 Warnung wegen fehlendem Land bei Firma F035). Zeile danach
# wieder entfernt, da nicht mehr nötig - der Befehl selbst bleibt idempotent in
# vertrieb/management/commands/import_leadliste.py erhalten, falls die Liste
# später erneut gepflegt und importiert werden soll.
#
# EINMALIGES AUFRAEUMEN (11.10.2026): Die 3 Beispiel-Firmen aus der Testphase
# (Müller Maschinenbau, GrünPack, Nordlicht) werden einmalig per Django-Shell im
# Start Command gelöscht, da jetzt echte Leads importiert sind. Zugehörige Kontakte/
# Deals/Aktivitäten/Angebote werden per CASCADE automatisch mitgelöscht. Nach
# Bestätigung im Log wieder entfernen.

services:
  - type: web
    name: eckopack-crm
    runtime: python
    plan: starter
    disk:
      name: eckopack-data
      mountPath: /var/data
      sizeGB: 1
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput
    startCommand: >
      python manage.py migrate &&
      python manage.py beispieldaten &&
      python manage.py shell -c "from vertrieb.models import Firma; names=['M\u00fcller Maschinenbau GmbH','Gr\u00fcnPack Lebensmittel AG','Nordlicht Immobilien Verwaltung']; qs=Firma.objects.filter(name__in=names); print('Loesche', qs.count(), 'Beispiel-Firmen:', list(qs.values_list('name', flat=True))); qs.delete()" &&
      gunicorn eckopack_crm.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SQLITE_PATH
        value: /var/data/db.sqlite3
