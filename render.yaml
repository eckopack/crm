# Render.com Blueprint.
# Läuft auf dem Starter-Plan (kostenpflichtig, aktuell 7 $/Monat) MIT persistenter
# Disk (1 GB, ca. 0,25 $/Monat zusätzlich) – die SQLite-Datenbank liegt auf dieser
# Disk unter /var/data und übersteht damit Neustarts und Inaktivitäts-Spin-downs
# (anders als beim kostenlosen Plan, der keine persistente Disk unterstützt und bei
# jeder Inaktivität >15 Min das Dateisystem zurücksetzt). Für echten Dauerbetrieb mit
# mehreren Nutzern und Backups später trotzdem auf einen VPS mit PostgreSQL umziehen
# (siehe README.md, Abschnitt Deployment) – diese Lösung ist die kostengünstige
# Zwischenstufe für die interne Testphase.
#
# WICHTIG (Fix 11.10.2026): Persistente Disks sind laut Render-Doku während des
# Build Command NICHT verfügbar, erst zur Laufzeit (Start Command). migrate/
# beispieldaten dürfen deshalb NICHT im Build Command laufen. Beide Befehle laufen
# im Start Command, direkt vor gunicorn. collectstatic bleibt im Build Command, da
# es nicht auf die Disk angewiesen ist.
#
# ECHTE URSACHE GEFUNDEN (11.10.2026): Die Datenbank wurde bei jedem Deploy neu
# angelegt, weil eckopack_crm/settings.py die Variable DJANGO_SQLITE_PATH gar
# nicht ausgewertet hat (ein Tippfehler bei einem früheren Datei-Update - eine
# Kopie der korrigierten settings.py landete versehentlich im falschen Ordner).
# Jetzt in eckopack_crm/settings.py korrigiert: Die SQLite-Datei liegt damit
# tatsächlich unter /var/data/db.sqlite3 auf der persistenten Disk.
#
# EINMALIGER IMPORT (11.10.2026, erledigt): import_leadliste lief einmalig im Start
# Command und hat die echte Lead-Recherche-Liste erfolgreich übernommen (35 Firmen,
# 51 Kontakte, 36 Deals, 1 Warnung wegen fehlendem Land bei Firma F035). Zeile danach
# wieder entfernt, da nicht mehr nötig - der Befehl selbst bleibt idempotent in
# vertrieb/management/commands/import_leadliste.py erhalten, falls die Liste
# später erneut gepflegt und importiert werden soll.
#
# EINMALIGES AUFRAEUMEN (11.10.2026, erledigt): Die 3 Beispiel-Firmen aus der
# Testphase (Müller Maschinenbau, GrünPack, Nordlicht) wurden einmalig per
# Django-Shell im Start Command gelöscht (Log bestätigt: "Loesche 3 Beispiel-
# Firmen"), zugehörige Kontakte/Deals/Aktivitäten/Angebote per CASCADE mit. Zeile
# danach wieder entfernt, da nicht mehr nötig.
#
# EINMALIGE ZUWEISUNG (11.10.2026, erledigt): Alle importierten Firmen/Deals/
# Aktivitäten hatten kein Feld "Zuständiger" (Excel-Quelle leer). Einmalig im Start
# Command auf den admin-User gesetzt (Log bestätigt: "Zustaendiger gesetzt - Firmen:
# 35 Deals: 36 Aktivitaeten: 36"). Zeile danach wieder entfernt.
#
# EINMALIGER EXPORT (11.10.2026, teilweise erledigt): Kontakte/Deals erfolgreich
# ausgelesen (51 Kontakte, 36 Deals, Praefix KONTAKT_ROW:/DEAL_ROW:). Die 35
# Firmen-Zeilen (Praefix FIRMA_ROW:) waren in der Render-Log-Oberflaeche nicht
# mehr scrollbar erreichbar - deshalb hier als eigener, kleinerer Nachtrag
# wiederholt. Nach Auslesen wieder entfernen.
#
# NACHFASS-CRON (12.10.2026, neu): Der zweite Service unten (eckopack-crm-nachfass)
# ist bewusst KEIN "cron"-Service-Typ mit eigenem manage.py-Aufruf, sondern ruft per
# curl nur eine URL auf dem laufenden Web-Service auf. Grund: Render-Disks sind laut
# Render-Doku jeweils nur an GENAU EINEN Service gebunden - ein separater Cron-Job-
# Service könnte die SQLite-Datei auf /var/data gar nicht sehen/beschreiben, selbst
# wenn er denselben Disk-Namen referenziert. Die eigentliche Pruefung (management
# command nachfass_pruefen) läuft deshalb weiterhin im Web-Prozess, der die Disk
# ohnehin schon gemountet hat; der Cron-Job braucht dafür nur ausgehende HTTPS-
# Verbindungen, keine eigene Disk und keinen eigenen Datenbankzugriff. Schutz über
# das gemeinsame Secret NACHFASS_CRON_SECRET (muss bei beiden Services identisch
# gesetzt werden - in der Render-Oberfläche einmal von Hand eintragen, nicht
# generateValue, damit beide Services denselben Wert bekommen).
#
# PRUEFEN VOR AKTIVIERUNG: Plan/Preis für einen Render-"Cron Job"-Service bitte im
# eigenen Dashboard bestätigen, bevor dieser Service dort angelegt wird - das habe
# ich nicht zuverlässig recherchieren können (Websuche in dieser Session deaktiviert).
# Ebenso: E-Mail-Versand (DJANGO_EMAIL_HOST etc. unten) läuft erst, wenn echte SMTP-
# Zugangsdaten eines Transaktions-Mailanbieters eingetragen sind - ohne das schreibt
# die App E-Mails nur ins Render-Log (Konsolen-Backend), verschickt aber nichts.
#
# ARTIKELSTAMM-IMPORT (14.10.2026, neu): Anders als import_leadliste läuft
# import_artikelstamm bewusst DAUERHAFT bei jedem Deploy mit (nicht nur einmalig) -
# die Datei data/20261014_LUAMO_Masterartikelstamm.xlsx ist als "lebende Masterdatei"
# gedacht: Zeile in der Datei ändern, committen, pushen, beim nächsten Deploy zieht
# der Import automatisch nach. Der Befehl ist idempotent (Abgleich über
# Artikelnummer) und legt bei 16 Artikelzeilen keine spürbare Startzeit-Verzögerung
# hin. Details/Annahmen zum Import siehe Docstring in
# vertrieb/management/commands/import_artikelstamm.py.

services:
  - type: web
    name: eckopack-crm
    runtime: python
    plan: starter
    disk:
      name: eckopack-data
      mountPath: /var/data
      sizeGB: 1
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput
    startCommand: >
      python manage.py migrate &&
      python manage.py beispieldaten &&
      python manage.py import_artikelstamm data/20261014_LUAMO_Masterartikelstamm.xlsx &&
      gunicorn eckopack_crm.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SQLITE_PATH
        value: /var/data/db.sqlite3
      - key: NACHFASS_CRON_SECRET
        sync: false
      - key: DJANGO_EMAIL_HOST
        sync: false
      - key: DJANGO_EMAIL_PORT
        sync: false
      - key: DJANGO_EMAIL_HOST_USER
        sync: false
      - key: DJANGO_EMAIL_HOST_PASSWORD
        sync: false
      - key: DJANGO_EMAIL_USE_TLS
        sync: false
      - key: DJANGO_DEFAULT_FROM_EMAIL
        sync: false

  # Woechentlicher Anstoss der Nachfass-Pruefung fuer Musterversand-Leads (siehe
  # Kommentar "NACHFASS-CRON" oben). Braucht keine Disk und keinen DB-Zugriff, nur
  # ausgehende HTTPS-Verbindungen zum eigenen Web-Service.
  - type: cron
    name: eckopack-crm-nachfass
    runtime: python
    plan: starter
    schedule: "0 7 * * 1"
    buildCommand: "true"
    startCommand: >
      curl -fsS -X POST -H "X-Cron-Secret: $NACHFASS_CRON_SECRET"
      "https://eckopack-crm.onrender.com/interna/nachfass-cron/"
    envVars:
      - key: NACHFASS_CRON_SECRET
        sync: false
